name: Build APK

# Roda a cada push na branch main e também pode ser disparado manualmente
# pela aba "Actions" do GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # O projeto Flutter está dentro da subpasta "flappy_v5" do repositório
    # (e não na raiz), então todo comando "run:" abaixo precisa ser
    # executado de dentro dela.
    defaults:
      run:
        working-directory: flappy_v5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Java (exigido pelo Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buscar dependências
        run: flutter pub get

      # O projeto veio só com a pasta web/. Esta etapa gera a pasta android/
      # automaticamente, sem precisar versionar arquivos de build no repo.
      - name: Gerar projeto Android (só na primeira vez)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example .
          fi

      - name: Compilar APK (release)
        run: flutter build apk --release

      # Deixa o .apk disponível para download na página da execução,
      # em Actions > (execução) > Artifacts.
      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-apk
          # Caminho a partir da RAIZ do repositório (upload-artifact não usa
          # o working-directory acima), por isso o prefixo "flappy_v5/" aqui.
          path: flappy_v5/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
